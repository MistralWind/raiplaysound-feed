name: Generate Feeds

on:
  # Permette di lanciare il workflow a mano dal pulsante "Run workflow"
  workflow_dispatch:

  schedule:
    # --- Orari attuali (ora legale, UTC+2; GitHub usa l'ora UTC) ---
    - cron: "30 6 * * *"    # 08:30
    - cron: "5 10 * * *"    # 12:05
    - cron: "30 13 * * *"   # 15:30
    - cron: "15 17 * * *"   # 19:15
    - cron: "5 19 * * *"    # 21:05

    # --- Promemoria: aggiornamento ogni ora (al minuto 45) ---
    # Per tornare indietro: cancella il "#" davanti alla riga qui sotto
    # e metti il "#" davanti alle cinque righe sopra.
    # - cron: "45 * * * *"

    # --- Promemoria: gli stessi orari in ora solare (UTC+1), dal 25 ottobre ---
    # - cron: "30 7 * * *"    # 08:30
    # - cron: "5 11 * * *"    # 12:05
    # - cron: "30 14 * * *"   # 15:30
    # - cron: "15 18 * * *"   # 19:15
    # - cron: "5 20 * * *"    # 21:05
    
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate feeds
        run: npm run static

      - name: Commit updated README and cache
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add README.md
          git add -f cache/
          git diff --cached --quiet || git commit -m "Update README and cache"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
